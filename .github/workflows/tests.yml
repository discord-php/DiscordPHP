name: Tests

# Runs on every push and pull request, without Discord: the tests answer requests with a mock HTTP
# driver (getMockHttpDriver() in tests/functions.php), and the few that need the live test channel
# skip themselves. unit.yml runs the whole suite against Discord, by hand, with the bot's secrets.

on:
  push:
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: tests-${{ github.ref }}
  cancel-in-progress: true

jobs:
  phpunit:
    name: PHPUnit (PHP ${{ matrix.php }})
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    strategy:
      fail-fast: false
      matrix:
        # The dev dependencies (Pest 4, and PHPUnit 12 through it) need PHP 8.3; syntax-check covers 8.1 and 8.2.
        php: ['8.3', '8.4', '8.5']
    steps:
      - uses: actions/checkout@v7
        with:
          persist-credentials: false

      - name: Setup PHP
        uses: shivammathur/setup-php@v2
        with:
          php-version: ${{ matrix.php }}
          extensions: zlib, mbstring
          coverage: none

      - name: Install dependencies
        run: composer install --no-interaction --no-progress

      - name: Run PHPUnit
        # An empty token keeps the suite offline even if a secret is ever exposed to this workflow.
        env:
          DISCORD_TOKEN: ''
        run: vendor/bin/phpunit

  rpc-windows:
    name: RPC offline (Windows, PHP ${{ matrix.php }})
    runs-on: windows-latest
    timeout-minutes: 10
    strategy:
      fail-fast: false
      matrix:
        php: ['8.3', '8.5']
    steps:
      - uses: actions/checkout@v7
        with:
          persist-credentials: false

      - name: Setup PHP
        uses: shivammathur/setup-php@v2
        with:
          php-version: ${{ matrix.php }}
          extensions: zlib, mbstring
          coverage: none

      - name: Install dependencies
        run: composer install --no-interaction --no-progress

      - name: Verify RPC with injected offline transports
        # Exercises framing/lifecycle on Windows; does not claim native named-pipe or live Discord support.
        env:
          DISCORD_TOKEN: ''
        run: php vendor/bin/phpunit tests/RPC

  dependency-compatibility:
    name: Development dependencies (${{ matrix.line }}, PHP ${{ matrix.php }})
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    strategy:
      fail-fast: false
      matrix:
        include:
          - line: older
            php: '8.3'
            cache: '^6.4'
            pest: '^4.1.2'
          - line: newer
            php: '8.4'
            cache: '^8.1'
            pest: '^5.3.4'
    steps:
      - uses: actions/checkout@v7
        with:
          persist-credentials: false

      - name: Setup PHP
        uses: shivammathur/setup-php@v2
        with:
          php-version: ${{ matrix.php }}
          extensions: zlib, mbstring
          coverage: none

      - name: Install selected dependency lines
        run: |
          composer require --dev --no-update --no-interaction 'symfony/cache:${{ matrix.cache }}' 'pestphp/pest:${{ matrix.pest }}'
          composer update --no-interaction --no-progress
          composer show symfony/cache
          composer show psr/simple-cache
          composer show pestphp/pest

      - name: Exercise cache adapter and Pest runner
        env:
          DISCORD_TOKEN: ''
        run: |
          php -r 'require "vendor/autoload.php"; require "tests/DependencyCompatibilityTest.php"; if ((new ReflectionMethod(DependencyCompatibilityTest::class, "setUpBeforeClass"))->getDeclaringClass()->getName() !== PHPUnit\Framework\TestCase::class) { fwrite(STDERR, "Unexpected test setup\n"); exit(1); }'
          vendor/bin/pest --version
          vendor/bin/pest tests/DependencyCompatibilityTest.php

  syntax:
    name: Syntax (PHP ${{ matrix.php }})
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    strategy:
      fail-fast: false
      matrix:
        # The oldest versions composer.json allows, where the test tools cannot be installed.
        php: ['8.1', '8.2']
    steps:
      - uses: actions/checkout@v7
        with:
          persist-credentials: false

      - name: Setup PHP
        uses: shivammathur/setup-php@v2
        with:
          php-version: ${{ matrix.php }}
          coverage: none

      - name: Check that every source file parses
        # Prints only the files that fail, all of them: php -l exits 255 on a parse error, which would
        # make xargs stop at the first, so each failure exits 1 instead. pipefail (from `shell: bash`)
        # keeps the failure.
        shell: bash
        run: find src -name '*.php' -print0 | xargs -0 -n 1 -P 4 sh -c 'php -l -d display_errors=1 "$0" || exit 1' | { grep -v '^No syntax errors detected' || true; }

  style:
    name: Code style
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v7
        with:
          persist-credentials: false

      - name: Setup PHP
        uses: shivammathur/setup-php@v2
        with:
          php-version: '8.4'
          coverage: none

      - name: Install dependencies
        run: composer install --no-interaction --no-progress

      - name: Run php-cs-fixer
        run: vendor/bin/php-cs-fixer fix --dry-run --diff
